name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Baselines are committed by update-visual-baselines.yml using GITHUB_TOKEN,
  # and pushes made with that token do not trigger workflows -- so after a
  # baseline regeneration there is otherwise no way to re-run CI against it
  # short of pushing another commit.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect design system changes
        id: changed-files
        uses: dorny/paths-filter@v3
        with:
          filters: |
            design_system:
              - 'packages/design-system/**'

      - name: Dry-run dependent app impact
        if: steps.changed-files.outputs.design_system == 'true'
        run: node scripts/ci/dry-run-design-system-impact.mjs

      # Contracts owned by this repo — these gate the build.
      - name: Validate platform contracts (local)
        shell: bash
        run: pnpm validate:platform-contracts:local

      # Contracts against external linked repos. These depend on repos this
      # build does not control (and which may not have published their contract
      # files yet). Each check is advisory by default and can be promoted to
      # blocking independently by setting the matching repo variable to "true":
      #   - LINKED_MANIFESTS_STRICT
      #   - LINKED_OPENAPI_STRICT
      #   - LINKED_ERROR_ENVELOPE_STRICT
      # Readiness is tracked by the "Report linked contract readiness" step.
      - name: Validate linked manifests
        shell: bash
        continue-on-error: ${{ vars.LINKED_MANIFESTS_STRICT != 'true' }}
        env:
          STRICT: ${{ vars.LINKED_MANIFESTS_STRICT }}
        run: |
          args=()
          if [ "$STRICT" = "true" ]; then args+=("--strict"); fi
          node scripts/ci/validate-linked-repo-manifests.mjs "${args[@]}"

      - name: Validate linked backend OpenAPI snapshots
        shell: bash
        continue-on-error: ${{ vars.LINKED_OPENAPI_STRICT != 'true' }}
        env:
          STRICT: ${{ vars.LINKED_OPENAPI_STRICT }}
        run: |
          args=(--check)
          if [ "$STRICT" = "true" ]; then args+=("--strict"); fi
          node scripts/contracts/sync-linked-openapi-snapshots.mjs "${args[@]}"

      - name: Validate linked error-envelope samples
        shell: bash
        continue-on-error: ${{ vars.LINKED_ERROR_ENVELOPE_STRICT != 'true' }}
        env:
          STRICT: ${{ vars.LINKED_ERROR_ENVELOPE_STRICT }}
        run: |
          args=()
          if [ "$STRICT" = "true" ]; then args+=("--strict"); fi
          node scripts/contracts/validate-linked-error-envelopes.mjs "${args[@]}"

      - name: Report linked contract readiness
        run: pnpm report:linked-contract-readiness:write

      - name: Upload linked readiness report artifact
        uses: actions/upload-artifact@v4
        with:
          name: linked-contract-readiness
          path: docs/linked-contract-readiness.md
          if-no-files-found: error

      - name: Check OpenAPI snapshot drift (optional)
        if: ${{ vars.OPENAPI_SOURCE_URL != '' }}
        env:
          OPENAPI_SOURCE_URL: ${{ vars.OPENAPI_SOURCE_URL }}
          OPENAPI_AUTH_HEADER: ${{ secrets.OPENAPI_AUTH_HEADER }}
          OPENAPI_OUT_PATH: openapi/second-brain.openapi.snapshot.json
        run: pnpm contracts:openapi:check

      - name: Build (with Turbo remote cache)
        run: pnpm turbo run build

      # The per-vision records are generated from the theme objects by `pnpm build`
      # and committed, so a token change shows up as a documentation change in the
      # same PR. If the build produced a diff, they were not regenerated.
      - name: Vision docs are up to date
        run: git diff --exit-code -- docs/visions

      - name: Type check
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

      # NOTE: `pnpm format:check` is deliberately NOT a gate yet. It has never run
      # in CI and the repo currently fails it in 276 files, so turning it on here
      # would either fail every build or force a repo-wide reformat that buries
      # the diff it is attached to. Reformatting is its own piece of work.

      # Every workspace suite, not just the design system's. The command-panel
      # packages hold 94 tests between them that had never run in CI — which is
      # how two of them sat asserting a hardcoded catalog size of 12 and went red
      # the moment a thirteenth vision landed, with nothing to report it.
      - name: Unit tests
        run: pnpm -r --if-present test

      # Exports plus the design floors: WCAG AA contrast across all 13 visions in
      # both modes, the body line-height and interactive type floors, the radius
      # scale, edge redundancy, and overshoot on the standard easing.
      - name: Validate design-system exports and design floors
        run: pnpm --filter @nikolayvalev/design-system validate

      # Agents install component source through the hosted MCP server, so a bundle
      # that references a file the deploy does not mirror is code that will not
      # build in a consumer's repo. This assembles every bundle against the same
      # directory shape the deploy produces and fails on any unresolved import.
      - name: Validate MCP install bundles are self-contained
        run: pnpm validate:mcp-bundles

      # Advisory. The source currently reports exactly one anti-pattern —
      # clay_soft's emphatic spring — and that is a documented divergence, not a
      # backlog item (see the Motion section of DESIGN.md). The remaining notes
      # are "colour outside DESIGN.md", which is inherent to a 13-vision catalog
      # whose records cannot all fit one single-valued frontmatter. Keeping this
      # advisory is deliberate: the rules we hold to are in eslint and the floor
      # validator, and this is the wider net that catches what they do not.
      - name: Design detector (advisory)
        continue-on-error: true
        run: npx --yes impeccable detect --json packages/design-system/src apps/storybook/src

      - name: Install Playwright browsers
        run: pnpm --filter @apps/storybook exec playwright install --with-deps chromium

      # Runs axe against every story via .storybook/test-runner.ts.
      - name: Storybook interaction and accessibility tests
        run: pnpm --filter @apps/storybook test:stories:ci

  storybook-visual:
    name: Storybook Visual Regression
    runs-on: ubuntu-latest
    # Pin to the Playwright image matching @playwright/test so rendering is
    # deterministic. Baselines are generated in this same image (see the
    # "Update Visual Baselines" workflow), so screenshots match byte-for-byte.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Storybook visual regression tests
        run: pnpm --filter @apps/storybook test:visual
