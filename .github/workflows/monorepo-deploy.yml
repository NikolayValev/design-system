name: Monorepo Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monorepo-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-vercel:
    name: Deploy Vercel Apps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          # vercel_project is the project name as it appears in the Vercel
          # dashboard; it does not match id. apps/storybook is deliberately not
          # listed: its Vercel project ("design-system") is connected to this
          # repo and redeploys itself on every push that touches that directory,
          # which is why Storybook stayed current while the portal went stale.
          # Deploying it from here as well is redundant, and it is the harder
          # half to build standalone since it depends on the workspace.
          - id: design-system-mcp
            path: packages/mcp-server
            project_id_secret: VERCEL_PROJECT_ID_DESIGN_SYSTEM_MCP
            # Serves the public portal on designsystem.nikolayvalev.com.
            vercel_project: mcp-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check app presence
        id: check
        shell: bash
        run: |
          if [ -f "${{ matrix.app.path }}/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping ${{ matrix.app.id }} because ${{ matrix.app.path }}/package.json is missing."
          fi

      - name: Build app
        if: steps.check.outputs.exists == 'true'
        run: pnpm turbo run build --filter=./${{ matrix.app.path }}

      - name: Bundle design-system sources into MCP server
        if: steps.check.outputs.exists == 'true' && matrix.app.id == 'design-system-mcp'
        run: |
          cp -r packages/design-system/src/vde-themes  packages/mcp-server/design-system-src/
          cp -r packages/design-system/src/components  packages/mcp-server/design-system-src/
          cp -r packages/design-system/src/sections    packages/mcp-server/design-system-src/
          cp -r packages/design-system/src/pages       packages/mcp-server/design-system-src/
          cp packages/design-system/CONTRIBUTION_GUIDE.md  packages/mcp-server/CONTRIBUTION_GUIDE.md

      - name: Check deployment secrets
        if: steps.check.outputs.exists == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.app.project_id_secret] }}
        run: >-
          node scripts/ci/validate-deploy-secrets.mjs
          --app ${{ matrix.app.id }}
          --vercel-project ${{ matrix.app.vercel_project }}
          --project-id-secret ${{ matrix.app.project_id_secret }}

      - name: Deploy app to Vercel
        if: steps.check.outputs.exists == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.app.project_id_secret] }}
        # Built on Vercel, not locally. `vercel build` + `deploy --prebuilt`
        # completed the build and then failed the deploy with
        #   File does not exist: "packages/mcp-server/node_modules/fast-glob"
        # because the prebuilt output cannot trace dependencies through pnpm's
        # symlinked workspace store. packages/mcp-server has no workspace
        # dependencies, so uploading it and letting Vercel install and build is
        # both simpler and the path that actually works.
        run: |
          pnpm dlx vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --cwd "${{ matrix.app.path }}"
          pnpm dlx vercel deploy --prod --yes --token="$VERCEL_TOKEN" --cwd "${{ matrix.app.path }}"
